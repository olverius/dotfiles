# hyprlock — Gruvbox Material, minimal

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Blurred, dimmed version of your current wallpaper
background {
    monitor =
    path = ~/.cache/current-wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

# Greeting (changes with the time of day)
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ $h -lt 5 ]; then g="good night"; elif [ $h -lt 12 ]; then g="good morning"; elif [ $h -lt 18 ]; then g="good afternoon"; else g="good evening"; fi; echo "$g, olverius"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgb(a9b665)
    position = 0, 190
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgb(d4be98)
    position = 0, 110
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = rgb(d4be98)
    position = 0, 40
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 280, 46
    rounding = 6
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = rgb(a9b665)
    inner_color = rgb(282828)
    font_color = rgb(d4be98)
    check_color = rgb(d8a657)
    fail_color = rgb(ea6962)
    fade_on_empty = false
    placeholder_text = <i>password</i>
    fail_text = <i>try again</i>
    position = 0, -50
    halign = center
    valign = center
}

# Battery (top right)
label {
    monitor =
    text = cmd[update:30000] b=/sys/class/power_supply/BAT0; [ "$(cat $b/status)" = "Charging" ] && i="󰂄" || i="󰁹"; echo "$i  $(cat $b/capacity)%"
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = rgb(a89984)
    position = -30, -25
    halign = right
    valign = top
}

# Now playing (bottom)
label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format "󰎇  {{ artist }} – {{ title }}" 2>/dev/null
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = rgb(a89984)
    position = 0, 40
    halign = center
    valign = bottom
}
