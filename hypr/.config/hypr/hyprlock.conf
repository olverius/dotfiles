# hyprlock — Gruvbox Material, minimal

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Blurred, dimmed version of your current wallpaper
background {
    monitor =
    path = ~/.cache/current-wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgb(d4be98)
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = rgb(d4be98)
    position = 0, 50
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 280, 46
    rounding = 6
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = rgb(a9b665)
    inner_color = rgb(282828)
    font_color = rgb(d4be98)
    check_color = rgb(d8a657)
    fail_color = rgb(ea6962)
    fade_on_empty = false
    placeholder_text = <i>password</i>
    fail_text = <i>try again</i>
    position = 0, -40
    halign = center
    valign = center
}
