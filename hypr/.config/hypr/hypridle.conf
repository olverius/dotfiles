# hypridle — dim, lock, then sleep

general {
    lock_cmd = pidof hyprlock || hyprlock       # don't start a second lock screen
    before_sleep_cmd = loginctl lock-session    # always lock before suspend
}

# 2.5 min: dim the screen
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 15 min: suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
