# tmux — minimal, Gruvbox Material
# Prefix stays the default: Ctrl+b

# ---- Basics ----
set -g mouse on                      # click panes, drag borders, scroll
set -g base-index 1                  # windows start at 1 (matches the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on           # no gaps after closing a window
set -g history-limit 10000
set -sg escape-time 10               # no delay after Esc (important in Neovim)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"   # true colors in kitty

# ---- Splits that make sense: | side by side, - top/bottom ----
# (new panes open in the current folder)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Vim keys to move between panes: prefix + h/j/k/l ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize with prefix + H/J/K/L (hold to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode with vim keys: prefix + [ , then v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Reload this file: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

# ---- Gruvbox Material colors ----
set -g status-position bottom
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-left "#[fg=#282828,bg=#a9b665,bold] #S #[bg=#282828] "
set -g status-left-length 30
set -g status-right "#[fg=#7c6f64]%H:%M "
setw -g window-status-format "#[fg=#7c6f64] #I #W "
setw -g window-status-current-format "#[fg=#d8a657,bold] #I #W "

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#a9b665"
set -g message-style "bg=#32302f,fg=#d8a657"
setw -g mode-style "bg=#d8a657,fg=#282828"
