# cliamp config

# EQ: Sony WH-1000XM4 — tame low-mid mud, bring vocals forward, a touch of air
# "Custom" (or empty) uses the manual eq values below
eq_preset = "Custom"
#       70  180  320  600  1k  3k  6k  12k  14k  16k
eq = [   0,  -4,  -3,  -1,  0,  2,  0,   1,   1,   0]

# Bass-friendly alternative (hip-hop / electronic):
# eq = [ 2,  -2,  -3,  -1,  0,  2,  0,   1,   1,   0]

# Spotify (needs Premium). No client_id = cliamp's built-in one,
# which avoids the Development Mode search block.
# To use your own app instead, add: client_id = "..."
# (redirect URI in the dashboard must be http://127.0.0.1:19872/login)
theme = "gruvbox"
visualizer = "Retro"
[spotify]
client_id = 6cb3f54ba80943e1a42f34af72f523e3
bitrate = 320
